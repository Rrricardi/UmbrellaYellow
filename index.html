<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UmbrellaYellow — Fondos de pantalla gratis</title>
<meta name="description" content="Descarga fondos de pantalla para celular, tablet y PC. Gratis, en alta calidad.">

<!-- Tipografías -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   UmbrellaYellow — estilos
   Paleta:
   --yellow-900  #7A5B00  amarillo oscuro (texto sobre amarillo)
   --yellow-700  #E8A800  amarillo ámbar (hover / bordes)
   --yellow-500  #FFC700  amarillo principal
   --yellow-300  #FFE066  amarillo claro
   --yellow-100  #FFF6D6  amarillo muy claro (fondos)
   --white       #FFFFFF
   --ink         #2B2411  casi negro cálido, para texto
   ========================================================= */

:root {
  --yellow-900: #7A5B00;
  --yellow-700: #E8A800;
  --yellow-500: #FFC700;
  --yellow-300: #FFE066;
  --yellow-100: #FFF6D6;
  --white: #FFFFFF;
  --ink: #2B2411;

  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', sans-serif;

  --radius: 18px;
  --shadow: 0 10px 30px rgba(122, 91, 0, 0.15);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--white);
}

img { max-width: 100%; display: block; }

a { color: inherit; text-decoration: none; }

button {
  font-family: inherit;
  cursor: pointer;
}

/* ============ HEADER ============ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--white);
  border-bottom: 1px solid var(--yellow-300);
}

.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 32px;
  flex-wrap: wrap;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.logo-mark {
  width: 30px;
  height: 30px;
  color: var(--yellow-500);
}

.logo-text {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.35rem;
  color: var(--ink);
}

.logo-accent {
  color: var(--yellow-700);
}

.search-form {
  flex: 1;
  min-width: 220px;
  display: flex;
  align-items: center;
  background: var(--yellow-100);
  border: 2px solid transparent;
  border-radius: 999px;
  padding: 6px 8px 6px 18px;
  transition: border-color .2s ease;
}

.search-form:focus-within {
  border-color: var(--yellow-500);
}

.search-icon {
  width: 18px;
  height: 18px;
  color: var(--yellow-900);
  flex-shrink: 0;
}

.search-form input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  padding: 8px 10px;
  font-size: 0.95rem;
  color: var(--ink);
  font-family: var(--font-body);
}

.search-form input::placeholder {
  color: #9c8a4a;
}

.search-btn {
  background: var(--yellow-500);
  color: var(--ink);
  border: none;
  border-radius: 999px;
  padding: 10px 20px;
  font-weight: 600;
  font-size: 0.9rem;
  transition: background .2s ease;
  white-space: nowrap;
}

.search-btn:hover { background: var(--yellow-700); color: var(--white); }

/* ============ HERO ============ */
.hero {
  position: relative;
  overflow: hidden;
  background: var(--yellow-500);
  padding: 72px 24px 64px;
  text-align: center;
}

.hero-rays {
  position: absolute;
  inset: -20% -20% auto -20%;
  height: 140%;
  background: repeating-conic-gradient(
    from 0deg,
    rgba(255,255,255,0.16) 0deg 6deg,
    transparent 6deg 12deg
  );
  transform: translateY(-10%);
  opacity: 0.7;
  pointer-events: none;
}

.hero-inner {
  position: relative;
  max-width: 700px;
  margin: 0 auto;
}

.eyebrow {
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-size: 0.78rem;
  color: var(--yellow-900);
  margin: 0 0 14px;
}

.hero h1 {
  font-family: var(--font-display);
  font-size: clamp(2.1rem, 5vw, 3.4rem);
  line-height: 1.08;
  margin: 0 0 16px;
  color: var(--ink);
  font-weight: 700;
}

.hero h1 .highlight {
  font-style: italic;
  color: var(--white);
  -webkit-text-stroke: 1px var(--ink);
}

.hero-sub {
  font-size: 1.05rem;
  color: #4a3c0f;
  margin: 0;
}

/* ============ FILTROS ============ */
.filters {
  max-width: 1200px;
  margin: 32px auto 8px;
  padding: 0 24px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.chip {
  background: var(--white);
  border: 2px solid var(--yellow-300);
  color: var(--yellow-900);
  border-radius: 999px;
  padding: 8px 18px;
  font-weight: 600;
  font-size: 0.88rem;
  transition: all .2s ease;
}

.chip:hover {
  border-color: var(--yellow-500);
}

.chip.is-active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--yellow-300);
}

/* ============ GALERÍA ============ */
.gallery-section {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 24px 80px;
}

.results-count {
  font-size: 0.85rem;
  color: #8a7a45;
  margin: 8px 4px 20px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 20px;
}

.card {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--yellow-100);
  aspect-ratio: 3 / 4;
  cursor: pointer;
  box-shadow: 0 2px 10px rgba(122,91,0,0.08);
  transition: transform .25s ease, box-shadow .25s ease;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow);
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-overlay {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 30px 14px 14px;
  background: linear-gradient(to top, rgba(43,36,17,0.85), transparent);
  color: var(--white);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .2s ease, transform .2s ease;
}

.card:hover .card-overlay,
.card:focus-visible .card-overlay {
  opacity: 1;
  transform: translateY(0);
}

.card-overlay .card-name {
  font-weight: 600;
  font-size: 0.92rem;
  margin: 0 0 2px;
}

.card-overlay .card-tag {
  font-size: 0.72rem;
  color: var(--yellow-300);
  text-transform: capitalize;
}

.no-results {
  text-align: center;
  color: #8a7a45;
  padding: 60px 0;
  font-size: 1rem;
}

/* ============ MODAL ============ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(43, 36, 17, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 100;
}

.modal-overlay[hidden] { display: none; }

.modal {
  background: var(--white);
  border-radius: 24px;
  max-width: 920px;
  width: 100%;
  max-height: 88vh;
  display: flex;
  overflow: hidden;
  position: relative;
  box-shadow: 0 30px 60px rgba(0,0,0,0.35);
}

.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  background: var(--white);
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 1rem;
  color: var(--ink);
  z-index: 5;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.modal-close:hover { background: var(--yellow-300); }

.modal-image-wrap {
  flex: 1.3;
  background: var(--yellow-100);
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
}

.modal-image-wrap img {
  width: 100%;
  height: 100%;
  max-height: 88vh;
  object-fit: contain;
}

.modal-info {
  flex: 1;
  padding: 32px 30px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 240px;
}

.modal-info h2 {
  font-family: var(--font-display);
  font-size: 1.6rem;
  margin: 0 0 8px;
}

.modal-meta {
  color: #8a7a45;
  font-size: 0.88rem;
  text-transform: capitalize;
  margin: 0 0 24px;
}

.download-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--yellow-500);
  color: var(--ink);
  font-weight: 700;
  padding: 14px 22px;
  border-radius: 999px;
  width: fit-content;
  transition: background .2s ease, transform .2s ease;
}

.download-btn svg {
  width: 18px;
  height: 18px;
}

.download-btn:hover {
  background: var(--ink);
  color: var(--yellow-300);
  transform: translateY(-2px);
}

/* ============ FOOTER ============ */
.site-footer {
  text-align: center;
  padding: 28px 24px;
  color: #9c8a4a;
  font-size: 0.85rem;
  border-top: 1px solid var(--yellow-100);
}

/* ============ RESPONSIVE ============ */
@media (max-width: 640px) {
  .header-inner { gap: 14px; }
  .modal { flex-direction: column; overflow-y: auto; }
  .modal-image-wrap img { max-height: 46vh; }
  .hero { padding: 56px 20px 48px; }
}

</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="site-header">
  <div class="header-inner">
    <a href="#top" class="logo">
      <svg class="logo-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M24 4C13 4 4 13 4 24h6a14 14 0 0 1 28 0h6C44 13 35 4 24 4Z" fill="currentColor"/>
        <rect x="22.3" y="22" width="3.4" height="16" rx="1.7" fill="currentColor"/>
        <path d="M22 36c0 2.5 1.8 4.5 4 4.5s4-2 4-4.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      </svg>
      <span class="logo-text">Umbrella<span class="logo-accent">Yellow</span></span>
    </a>

    <form class="search-form" role="search" id="searchForm">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <line x1="16.2" y1="16.2" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Buscar fondos… (ej: montaña, minimal, oscuro)" autocomplete="off">
      <button type="submit" class="search-btn">Buscar</button>
    </form>
  </div>
</header>

<!-- ============ HERO ============ -->
<section class="hero" id="top">
  <div class="hero-rays" aria-hidden="true"></div>
  <div class="hero-inner">
    <p class="eyebrow">Gratis · Alta calidad · Sin registro</p>
    <h1>Fondos de pantalla<br>para <span class="highlight">cada</span> pantalla.</h1>
    <p class="hero-sub">Elegí, mirá el detalle y descargá en un clic para tu celular, tablet o PC.</p>
  </div>
</section>

<!-- ============ FILTROS ============ -->
<nav class="filters" aria-label="Filtrar por dispositivo">
  <button class="chip is-active" data-filter="all">Todos</button>
  <button class="chip" data-filter="celular">Celular</button>
  <button class="chip" data-filter="tablet">Tablet</button>
  <button class="chip" data-filter="pc">PC</button>
</nav>

<!-- ============ GALERÍA ============ -->
<main class="gallery-section">
  <p class="results-count" id="resultsCount"></p>
  <div class="gallery" id="gallery">
    <!-- Las tarjetas se generan por JavaScript (ver bloque <script> más abajo) -->
  </div>
  <p class="no-results" id="noResults" hidden>No encontramos fondos con ese nombre. Probá con otra palabra.</p>
</main>

<!-- ============ MODAL DE DETALLE ============ -->
<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
    <div class="modal-image-wrap">
      <img id="modalImage" src="" alt="">
    </div>
    <div class="modal-info">
      <h2 id="modalTitle"></h2>
      <p id="modalMeta" class="modal-meta"></p>
      <a id="modalDownload" class="download-btn" href="" download>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Descargar
      </a>
    </div>
  </div>
</div>

<!-- ============ FOOTER ============ -->
<footer class="site-footer">
  <p>☂ UmbrellaYellow — Fondos de pantalla gratuitos.</p>
</footer>

<script>
/* =========================================================
   UmbrellaYellow — script.js
   -----------------------------------------------------------
   1) EDITÁ el array "wallpapers" con tus propias imágenes.
   2) Poné los archivos de imagen dentro de la carpeta /img.
   3) "src" es la ruta relativa al archivo dentro de /img.
   4) "device" debe ser: "celular", "tablet" o "pc".
   ========================================================= */

const wallpapers = [
 
  {
    id: 1,
    name: "agujero_negro_fondo_vertical",
    src: "img/agujero_negro_fondo_vertical.png",
    device: "celular"
  },
  {
    id: 2,
    name: "astronauta_caminando_marte_fondo_vertical",
    src: "img/astronauta_caminando_marte_fondo_vertical.png",
    device: "celular"
  },
  {
    id: 3,
    name: "astronauta_flotando_espacio_fondo_vertical",
    src: "img/astronauta_flotando_espacio_fondo_vertical.png",
    device: "celular"
  },
  {
    id: 4,
    name: "astronauta_planeta_fondo_vertical",
    src: "img/astronauta_planeta_fondo_vertical.png",
    device: "celular"
  },
  {
    id: 5,
    name: "astronauta_planeta_variante_01_hielo",
    src: "img/astronauta_planeta_variante_01_hielo.png",
    device: "celular"
  },
  {
    id: 6,
    name: "astronauta_planeta_variante_02_basalto",
    src: "img/astronauta_planeta_variante_02_basalto.png",
    device: "celular"
  },
  {
    id: 7,
    name: "astronauta_planeta_variante_03_crater",
    src: "img/astronauta_planeta_variante_03_crater.png",
    device: "celular"
  },
  {
    id: 8,
    name: "astronauta_planeta_variante_04_valle",
    src: "img/astronauta_planeta_variante_04_valle.png",
    device: "celular"
  },
  {
    id: 9,
    name: "astronauta_planeta_variante_05_eclipse",
    src: "img/astronauta_planeta_variante_05_eclipse.png",
    device: "celular"
  },
  {
    id: 10,
    name: "planeta_alienigena_fondo_vertical",
    src: "img/planeta_alienigena_fondo_vertical.png",
    device: "celular"
  },
  {
    id: 11,
    name: "sistema_solar_fondo_vertical",
    src: "img/sistema_solar_fondo_vertical.png",
    device: "celular"
  },
  {
    id: 12,
    name: "viaje_centro_universo_fondo_vertical",
    src: "img/viaje_centro_universo_fondo_vertical.png",
    device: "celular"
  },
  {
    id: 13,
    name: "viaje_nebulosa_fondo_vertical",
    src: "img/viaje_nebulosa_fondo_vertical.png",
    device: "celular"
  }

];

/* ============ ESTADO ============ */
let currentFilter = "all";
let currentQuery = "";

/* ============ ELEMENTOS ============ */
const galleryEl = document.getElementById("gallery");
const resultsCountEl = document.getElementById("resultsCount");
const noResultsEl = document.getElementById("noResults");
const searchForm = document.getElementById("searchForm");
const searchInput = document.getElementById("searchInput");
const chips = document.querySelectorAll(".chip");

const modalOverlay = document.getElementById("modalOverlay");
const modalImage = document.getElementById("modalImage");
const modalTitle = document.getElementById("modalTitle");
const modalMeta = document.getElementById("modalMeta");
const modalDownload = document.getElementById("modalDownload");
const modalClose = document.getElementById("modalClose");

/* ============ RENDER DE LA GALERÍA ============ */
function renderGallery() {
  const query = currentQuery.trim().toLowerCase();

  const filtered = wallpapers.filter(w => {
    const matchesFilter = currentFilter === "all" || w.device === currentFilter;
    const matchesQuery = w.name.toLowerCase().includes(query);
    return matchesFilter && matchesQuery;
  });

  galleryEl.innerHTML = "";

  if (filtered.length === 0) {
    noResultsEl.hidden = false;
  } else {
    noResultsEl.hidden = true;
  }

  filtered.forEach(w => {
    const card = document.createElement("article");
    card.className = "card";
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.setAttribute("aria-label", `Ver ${w.name}`);

    card.innerHTML = `
      <img src="${w.src}" alt="${w.name}" loading="lazy">
      <div class="card-overlay">
        <p class="card-name">${w.name}</p>
        <span class="card-tag">${w.device}</span>
      </div>
    `;

    card.addEventListener("click", () => openModal(w));
    card.addEventListener("keypress", (e) => {
      if (e.key === "Enter" || e.key === " ") openModal(w);
    });

    galleryEl.appendChild(card);
  });

  resultsCountEl.textContent = `${filtered.length} fondo${filtered.length === 1 ? "" : "s"} encontrado${filtered.length === 1 ? "" : "s"}`;
}

/* ============ MODAL ============ */
function openModal(wallpaper) {
  modalImage.src = wallpaper.src;
  modalImage.alt = wallpaper.name;
  modalTitle.textContent = wallpaper.name;
  modalMeta.textContent = `Ideal para ${wallpaper.device}`;
  modalDownload.href = wallpaper.src;
  modalDownload.setAttribute("download", wallpaper.name.replace(/\s+/g, "-").toLowerCase());

  modalOverlay.hidden = false;
  document.body.style.overflow = "hidden";
}

function closeModal() {
  modalOverlay.hidden = true;
  document.body.style.overflow = "";
}

modalClose.addEventListener("click", closeModal);
modalOverlay.addEventListener("click", (e) => {
  if (e.target === modalOverlay) closeModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

/* ============ BUSCADOR ============ */
searchForm.addEventListener("submit", (e) => {
  e.preventDefault();
  currentQuery = searchInput.value;
  renderGallery();
});

searchInput.addEventListener("input", () => {
  currentQuery = searchInput.value;
  renderGallery();
});

/* ============ FILTROS POR DISPOSITIVO ============ */
chips.forEach(chip => {
  chip.addEventListener("click", () => {
    chips.forEach(c => c.classList.remove("is-active"));
    chip.classList.add("is-active");
    currentFilter = chip.dataset.filter;
    renderGallery();
  });
});

/* ============ INICIO ============ */
renderGallery();

</script>
</body>
</html>
